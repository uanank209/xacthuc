<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xác Thực Nhận Thưởng - Sòng Bạc</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #0f0f13; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; text-align: center;
        }
        h1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-size: 24px; }
        .container { background: #1a1a24; padding: 40px; border-radius: 20px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.2); max-width: 400px; width: 90%; }
        
        #startBtn {
            background: linear-gradient(45deg, #ff00cc, #3333ff); border: none; color: white; padding: 15px 30px;
            font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: transform 0.2s;
        }
        #startBtn:hover { transform: scale(1.05); }

        .timer-wrapper { 
            position: relative; width: 140px; height: 140px; margin: 20px auto; display: none; 
            cursor: pointer;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; 
        }
        .timer-wrapper.holding { transform: scale(0.95); transition: transform 0.1s; }

        svg { width: 140px; height: 140px; transform: rotate(-90deg); }
        circle { fill: rgba(0, 255, 204, 0.1); stroke-width: 10; stroke-linecap: round; }
        .bg-circle { stroke: #333; }
        .progress-circle { stroke: #00ffcc; stroke-dasharray: 377; stroke-dashoffset: 377; }
        .time-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: bold; pointer-events: none; }
        .hint-text { position: absolute; top: 75%; left: 50%; transform: translate(-50%, -50%); font-size: 10px; color: #aaa; pointer-events: none; width: 100%;}

        .status-icon { font-size: 60px; display: none; animation: popIn 0.5s ease; margin-bottom: 15px;}
        .error { color: #ff3366; text-shadow: 0 0 20px #ff3366; }
        #statusText { margin-top: 15px; font-size: 16px; color: #aaa; line-height: 1.5; }

        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container">
        <h1>XÁC THỰC BẢO MẬT</h1>
        <p id="descText">Hệ thống cần xác minh bạn không phải là Robot.</p>
        
        <button id="startBtn">KIỂM TRA BẢO MẬT</button>

        <div class="timer-wrapper" id="timerWrapper">
            <svg>
                <circle class="bg-circle" cx="70" cy="70" r="60"></circle>
                <circle class="progress-circle" id="progressCircle" cx="70" cy="70" r="60"></circle>
            </svg>
            <div class="time-text" id="timeText">10</div>
            <div class="hint-text">CHẠM & GIỮ</div>
        </div>

        <div class="status-icon error" id="errorIcon">❌</div>
        <div id="statusText"></div>
    </div>

    <audio id="bgMusic" src="nhac.mp3"></audio>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idkey = urlParams.get('idkey');
        
        // ĐỊA CHỈ NHẬN CHUYỂN HƯỚNG CỦA BOT TẠI BOT-HOSTING
        const BOT_CALLBACK_URL = "http://fi6.bot-hosting.net:20375/api/verify_link";

        const startBtn = document.getElementById('startBtn');
        const timerWrapper = document.getElementById('timerWrapper');
        const timeText = document.getElementById('timeText');
        const progressCircle = document.getElementById('progressCircle');
        const statusText = document.getElementById('statusText');
        const errorIcon = document.getElementById('errorIcon');
        const bgMusic = document.getElementById('bgMusic');
        const descText = document.getElementById('descText');

        let holdTimer;
        const totalTime = 10000; 
        let timeLeft = totalTime; 
        const circumference = 377; 
        let isSuccess = false;

        startBtn.addEventListener('click', async () => {
            if(!idkey) {
                showError("Không tìm thấy mã xác thực (IDKey) hợp lệ!");
                return;
            }

            bgMusic.volume = 0.5;
            bgMusic.play().catch(e => console.log("Audio block"));
            
            startBtn.style.display = 'none';
            descText.style.display = 'none';
            statusText.innerText = "Đang kiểm tra địa chỉ IP (Anti-VPN)...";

            try {
                const ipRes = await fetch('https://ipwho.is/');
                const ipData = await ipRes.json();
                
                if (ipData.security && (ipData.security.vpn || ipData.security.proxy || ipData.security.tor)) {
                    showError("PHÁT HIỆN GIAN LẬN!<br>Bạn đang sử dụng VPN hoặc Proxy.");
                    return;
                }
            } catch (err) {
                console.log("Bỏ qua lỗi kiểm tra IP");
            }

            statusText.innerHTML = "<b>HƯỚNG DẪN:</b> Nhấn và <b>GIỮ LIÊN TỤC</b> vào vòng tròn bên trên trong 10 giây để xác nhận.";
            timerWrapper.style.display = 'block';
            updateCircle(timeLeft);
        });

        function startHolding(e) {
            if (isSuccess) return;
            e.preventDefault(); 
            timerWrapper.classList.add("holding");
            statusText.innerHTML = "<span style='color:#00ffcc;'>Đang xác thực... Đừng thả tay ra!</span>";

            clearInterval(holdTimer);
            holdTimer = setInterval(() => {
                timeLeft -= 50;
                updateCircle(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(holdTimer);
                    completeHolding();
                }
            }, 50);
        }

        function stopHolding(e) {
            if (isSuccess) return;
            e.preventDefault();
            timerWrapper.classList.remove("holding");
            clearInterval(holdTimer);
            
            if (timeLeft > 0 && timeLeft < totalTime) {
                timeLeft = totalTime;
                updateCircle(timeLeft);
                statusText.innerHTML = "<span style='color:#ff3366;font-weight:bold;'>BẠN ĐÃ THẢ TAY!</span><br>Thời gian đã bị làm mới. Vui lòng giữ liên tục 10 giây.";
            }
        }

        function updateCircle(timeRemaining) {
            timeText.innerText = Math.ceil(timeRemaining / 1000);
            const percent = timeRemaining / totalTime;
            const offset = percent * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        function completeHolding() {
            isSuccess = true;
            timerWrapper.classList.remove("holding");
            progressCircle.style.strokeDashoffset = 0; 
            timeText.innerText = "OK";
            
            timerWrapper.removeEventListener('mousedown', startHolding);
            timerWrapper.removeEventListener('touchstart', startHolding);
            
            sendRewardRequest();
        }

        function sendRewardRequest() {
            statusText.innerHTML = "<span style='color:#00ffcc;'>Xác thực xong! Đang chuyển hướng về Hệ Thống Sòng Bạc...</span>";
            // CHUYỂN HƯỚNG TRỰC TIẾP VỀ BOT (GIẢI QUYẾT LỖI MIXED CONTENT HTTPS -> HTTP)
            window.location.href = BOT_CALLBACK_URL + "?idkey=" + idkey;
        }

        function showError(msg) {
            timerWrapper.style.display = 'none';
            startBtn.style.display = 'none';
            errorIcon.style.display = 'block';
            statusText.innerHTML = msg;
        }

        // Chuột PC
        timerWrapper.addEventListener('mousedown', startHolding);
        timerWrapper.addEventListener('mouseup', stopHolding);
        timerWrapper.addEventListener('mouseleave', stopHolding); 
        
        // Cảm ứng Mobile
        timerWrapper.addEventListener('touchstart', startHolding, {passive: false});
        timerWrapper.addEventListener('touchend', stopHolding, {passive: false});
        timerWrapper.addEventListener('touchcancel', stopHolding, {passive: false});
    </script>
</body>
</html>
